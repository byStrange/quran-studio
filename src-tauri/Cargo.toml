[package]
name = "quran-studio"
version = "0.1.0"
description = "Ruku-by-ruku Quran memorization and study app"
authors = ["Rahmatullo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "quran_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
tokio = { version = "1", features = ["time", "fs", "io-util"] }
thiserror = "2"
dotenvy = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
