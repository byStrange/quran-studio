    <path d="M512 468v302" stroke="#0A4436" stroke-width="14" stroke-linecap="round" opacity="0.35"/>

    <!-- Text lines -->
    <g stroke="#0A4436" stroke-width="12" stroke-linecap="round" opacity="0.28">
      <path d="M340 546h128M340 598h140M340 650h108"/>
      <path d="M556 546h128M556 598h140M556 650h108"/>
