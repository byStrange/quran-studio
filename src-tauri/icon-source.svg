  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- Mihrab arch framing the book -->
  <path d="M512 168c-104 0-188 84-188 188v300h376V356c0-104-84-188-188-188z"
